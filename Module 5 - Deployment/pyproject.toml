[project]
name = "module-5-deployment"
version = "0.1.0"
description = "Churn prediction service"
readme = "README.md"
authors = [
    { name = "Manjeetvyas", email = "manjeetvyas4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
module-5-deployment = "module_5_deployment:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
